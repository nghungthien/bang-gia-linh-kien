<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bảng giá linh kiện giá sỉ</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
    }

    h1.page-title {
      margin: 20px 0;
      font-size: 28px;
      font-weight: 700;
      color: #e74c3c;
      text-align: center;
      text-transform: uppercase;
    }

    .table thead {
      background: #f8f8f8;
      font-weight: 600;
    }

    /* Căn giữa toàn bộ tiêu đề */
    table.dataTable thead th {
      text-align: center !important;
      vertical-align: middle !important;
    }

    /* Căn phải giá tiền */
    td.gia {
      text-align: right;
      padding-right: 15px;
    }

    /* Căn giữa VAT & Bảo hành */
    td.center {
      text-align: center;
    }

    /* Ô lọc loại sản phẩm */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .filter-wrapper label {
      margin-right: 8px;
      font-weight: 600;
    }
    .filter-wrapper select {
      width: auto;
      min-width: 180px;
    }

    /* Ô search custom */
    .search-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .search-box {
      border: 2px solid #e74c3c;
      border-radius: 2px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .search-box label {
      margin: 0 8px 0 0;
      font-weight: 600;
    }

    .search-box input {
      border: none;
      box-shadow: none !important;
      outline: none !important;
      flex: 1;
    }

    .search-icon {
      margin-left: 8px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container mt-3">

    <h1 class="page-title">BẢNG GIÁ LINH KIỆN GIÁ SỈ</h1>

    <!-- Lọc theo loại sản phẩm -->
    <div class="filter-wrapper">
      <label for="categoryFilter">Loại sản phẩm:</label>
      <select id="categoryFilter" class="form-select">
        <option value="">Tất cả</option>
      </select>
    </div>

    <!-- Ô search custom -->
    <div class="search-wrapper">
      <div class="search-box">
        <label for="globalSearch">Search:</label>
        <input type="text" id="globalSearch" placeholder="" />
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <!-- Bảng giá -->
    <table id="banggia" class="table table-striped table-hover table-bordered">
      <thead>
        <tr>
          <th>LOẠI</th>
          <th>SẢN PHẨM</th>
          <th>GIÁ BÁN</th>
          <th>VAT</th>
          <th>BẢO HÀNH</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sẽ được tự động fill từ banggia.xlsx -->
      </tbody>
    </table>
  </div>

  <!-- JS: jQuery + Bootstrap + DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <!-- SheetJS đọc Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    let table = null;

    function buildCategoryFilter() {
      const select = document.getElementById('categoryFilter');
      if (!select || !table) return;

      // Xóa các option cũ (giữ lại "Tất cả")
      while (select.options.length > 1) {
        select.remove(1);
      }

      const column = table.column(0); // cột LOẠI
      column.data().unique().sort().each(function (d) {
        const value = (d || '').toString().trim();
        if (value === '') return;
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value;
        select.appendChild(opt);
      });

      // Khi chọn loại thì filter theo cột 0
      select.addEventListener('change', function () {
        const val = this.value;
        if (val) {
          // regex chính xác: ^val$
          table.column(0).search('^' + $.fn.dataTable.util.escapeRegex(val) + '$', true, false).draw();
        } else {
          table.column(0).search('', true, false).draw();
        }
      });
    }

    function initDataTable() {
      if ($.fn.DataTable.isDataTable('#banggia')) {
        $('#banggia').DataTable().destroy();
      }

      table = $('#banggia').DataTable({
        dom: 'rt<"bottom"lip><"clear">',
        pageLength: 100,
        language: {
          search: "Tìm kiếm:",
          lengthMenu: "Hiển thị _MENU_ dòng",
          info: "Hiển thị _START_ đến _END_ trên tổng _TOTAL_ dòng",
          emptyTable: "Không có dữ liệu",
          paginate: {
            first: "Đầu",
            last: "Cuối",
            next: "Sau",
            previous: "Trước"
          }
        }
      });

      // Gắn search custom vào DataTables
      document.getElementById('globalSearch')
        .addEventListener('keyup', function () {
          table.search(this.value).draw();
        });

      // Xây dropdown loại sản phẩm
      buildCategoryFilter();
    }

    async function loadExcel() {
      try {
        const response = await fetch('banggia.xlsx');
        if (!response.ok) throw new Error("Không tìm thấy banggia.xlsx");

        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const tbody = document.querySelector("#banggia tbody");
        tbody.innerHTML = "";

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.every(v => v === "" || v === null || v === undefined)) continue;

          const tr = document.createElement("tr");

          // Cột A-E -> index 0-4
          for (let c = 0; c < 5; c++) {
            const td = document.createElement("td");
            const value = row[c] || "";

            if (c === 2) td.classList.add("gia");        // GIÁ BÁN
            if (c === 3 || c === 4) td.classList.add("center"); // VAT + BẢO HÀNH

            td.textContent = value;
            tr.appendChild(td);
          }

          tbody.appendChild(tr);
        }

        initDataTable();

      } catch (err) {
        console.error(err);
        alert("Lỗi đọc file banggia.xlsx: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", loadExcel);
  </script>

</body>
</html>
