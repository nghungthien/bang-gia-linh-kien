<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bảng giá linh kiện giá sỉ</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
    }

    h1.page-title {
      margin: 20px 0 10px;
      font-size: 28px;
      font-weight: 700;
      color: #e74c3c;
      text-align: center;
      text-transform: uppercase;
    }

    .table thead {
      background: #f8f8f8;
      font-weight: 600;
    }

    /* Tiêu đề cột đỏ đậm, căn giữa */
    #banggia thead th {
      text-align: center !important;
      vertical-align: middle !important;
      color: #e74c3c;
      font-weight: 700;
    }

    /* Căn phải giá tiền */
    td.gia {
      text-align: right;
      padding-right: 15px;
    }

    /* Căn giữa VAT & Bảo hành */
    td.center {
      text-align: center;
    }

    /* KHỐI CONTROL (lọc + search) */
    .controls {
      width: 900px;
      max-width: 100%;
      margin: 0 auto 15px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .filter-row label {
      font-weight: 700;
      margin-right: 10px;
      font-size: 16px;
    }

    .filter-row select {
      width: 260px;
      height: 38px;
    }

    .search-row {
      border: 2px solid #e74c3c;
      border-radius: 2px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
    }

    .search-row label {
      margin-right: 10px;
      font-weight: 700;
    }

    .search-row input {
      border: none;
      outline: none !important;
      flex: 1;
      font-size: 15px;
    }

    .search-icon {
      margin-left: 8px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container mt-3">

    <h1 class="page-title">BẢNG GIÁ LINH KIỆN GIÁ SỈ</h1>

    <!-- Khối controls -->
    <div class="controls">
      <div class="filter-row">
        <label for="categoryFilter">Loại sản phẩm:</label>
        <select id="categoryFilter" class="form-select">
          <option value="">Tất cả</option>
        </select>
      </div>

      <div class="search-row">
        <label for="globalSearch">Search:</label>
        <input type="text" id="globalSearch" placeholder="">
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <!-- Bảng giá: 4 cột hiển thị -->
    <table id="banggia" class="table table-striped table-hover table-bordered">
      <thead>
        <tr>
          <th>SẢN PHẨM</th>
          <th>GIÁ BÁN</th>
          <th>VAT</th>
          <th>BẢO HÀNH</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    let table = null;
    let currentCategory = "";

    // Filter theo loại trong data-category
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
      if (!currentCategory) return true;
      const rowNode = table.row(dataIndex).node();
      const cat = rowNode.getAttribute("data-category") || "";
      return cat === currentCategory;
    });

    function buildCategoryFilter() {
      const select = document.getElementById("categoryFilter");
      while (select.options.length > 1) select.remove(1);

      const categories = new Set();
      table.rows().every(function () {
        const node = this.node();
        const cat = node.getAttribute("data-category");
        if (cat) categories.add(cat);
      });

      Array.from(categories).sort().forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });

      select.addEventListener("change", function () {
        currentCategory = this.value || "";
        table.draw();
      });
    }

    function initDataTable() {
      if ($.fn.DataTable.isDataTable("#banggia")) {
        $("#banggia").DataTable().destroy();
      }

      table = $("#banggia").DataTable({
        dom: 'rt',            // chỉ table + header, không phân trang, không info
        pageLength: -1,       // không dùng paging
        paging: false,        // tắt phân trang
        scrollY: '60vh',      // chiều cao, có thanh trượt dọc
        scrollCollapse: true,
        language: {
          emptyTable: "Không có dữ liệu"
        }
      });

      document.getElementById("globalSearch")
        .addEventListener("keyup", function () {
          table.search(this.value).draw();
        });

      buildCategoryFilter();
    }

    async function loadExcel() {
      try {
        const res = await fetch("banggia.xlsx");
        if (!res.ok) throw new Error("Không tìm thấy banggia.xlsx");

        const buf = await res.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });

        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const tbody = document.querySelector("#banggia tbody");
        tbody.innerHTML = "";

        // rows[i][0] = LOẠI
        // rows[i][1] = SẢN PHẨM
        // rows[i][2] = GIÁ BÁN
        // rows[i][3] = VAT
        // rows[i][4] = BẢO HÀNH
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;

          const category = row[0] || "";
          const name     = row[1] || "";
          const price    = row[2] || "";
          const vat      = row[3] || "";
          const warranty = row[4] || "";

          const tr = document.createElement("tr");
          tr.setAttribute("data-category", category);

          // SẢN PHẨM
          let td = document.createElement("td");
          td.textContent = name;
          tr.appendChild(td);

          // GIÁ BÁN
          td = document.createElement("td");
          td.classList.add("gia");
          td.textContent = price;
          tr.appendChild(td);

          // VAT
          td = document.createElement("td");
          td.classList.add("center");
          td.textContent = vat;
          tr.appendChild(td);

          // BẢO HÀNH
          td = document.createElement("td");
          td.classList.add("center");
          td.textContent = warranty;
          tr.appendChild(td);

          tbody.appendChild(tr);
        }

        initDataTable();
      } catch (err) {
        alert("Lỗi đọc Excel: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", loadExcel);
  </script>

</body>
</html>
