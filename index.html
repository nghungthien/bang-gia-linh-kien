<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bảng giá linh kiện giá sỉ</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
    }
    h1.page-title {
      margin: 20px 0;
      font-size: 28px;
      font-weight: 700;
      color: #e74c3c;
      text-align: center;
      text-transform: uppercase;
    }
    .table thead {
      background: #f8f8f8;
      font-weight: 600;
    }

    /* Căn phải giá tiền */
    td.gia {
      text-align: right;
      padding-right: 15px;
    }

    /* Căn giữa VAT & Bảo hành */
    td.center {
      text-align: center;
    }

    /* Hộp search custom giống hình 2 */
    .search-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .search-box {
      border: 2px solid #e74c3c;
      border-radius: 2px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 900px; /* để ô không quá rộng trên màn lớn */
    }

    .search-box label {
      margin: 0 8px 0 0;
      font-weight: 600;
    }

    .search-box input {
      border: none;
      box-shadow: none !important;
      outline: none !important;
      flex: 1;
    }

    .search-box input:focus {
      border: none;
      box-shadow: none;
    }

    .search-icon {
      margin-left: 8px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container mt-3">
    <h1 class="page-title">BẢNG GIÁ LINH KIỆN GIÁ SỈ</h1>

    <!-- Ô search custom -->
    <div class="search-wrapper">
      <div class="search-box">
        <label for="globalSearch">Search:</label>
        <input type="text" id="globalSearch" placeholder="" />
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <!-- Bảng giá -->
    <table id="banggia" class="table table-striped table-hover table-bordered">
      <thead>
        <tr>
          <th>SẢN PHẨM</th>
          <th>GIÁ BÁN</th>
          <th>VAT</th>
          <th>BẢO HÀNH</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sẽ được fill từ banggia.xlsx -->
      </tbody>
    </table>
  </div>

  <!-- JS: jQuery + Bootstrap + DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <!-- SheetJS: đọc file Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    let table = null;

    function initDataTable() {
      // hủy nếu đã init
      if ($.fn.DataTable.isDataTable('#banggia')) {
        $('#banggia').DataTable().destroy();
      }
      table = $('#banggia').DataTable({
        // dom: chỉ hiển thị table ở trên, length/info/paging ở dưới
        dom: 'rt<"bottom"lip><"clear">',
        pageLength: 100,
        language: {
          search: "Tìm kiếm:",        // vẫn dùng cho phần dưới nếu có
          lengthMenu: "Hiển thị _MENU_ dòng",
          info: "Hiển thị _START_ đến _END_ trên tổng _TOTAL_ dòng",
          infoEmpty: "Không có dữ liệu",
          emptyTable: "Không có dữ liệu",
          paginate: {
            first: "Đầu",
            last: "Cuối",
            next: "Sau",
            previous: "Trước"
          }
        }
      });

      // Gắn ô search custom với DataTables
      const input = document.getElementById('globalSearch');
      input.addEventListener('keyup', function () {
        if (table) {
          table.search(this.value).draw();
        }
      });
    }

    async function loadExcel() {
      try {
        const response = await fetch('banggia.xlsx');
        if (!response.ok) {
          throw new Error('Không tìm thấy file banggia.xlsx (HTTP ' + response.status + ')');
        }

        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });

        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

        const tbody = document.querySelector('#banggia tbody');
        tbody.innerHTML = "";

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;

          const isEmpty = row.every(cell =>
            cell === undefined || cell === null || cell === ""
          );
          if (isEmpty) continue;

          const tr = document.createElement('tr');

          // Cột A-D -> index 0-3
          for (let c = 0; c < 4; c++) {
            const td = document.createElement('td');
            const value = row[c] !== undefined ? row[c] : "";

            // Gán style theo cột
            if (c === 1) td.classList.add('gia');              // GIÁ BÁN
            if (c === 2 || c === 3) td.classList.add('center'); // VAT + BẢO HÀNH

            td.textContent = value;
            tr.appendChild(td);
          }

          tbody.appendChild(tr);
        }

        initDataTable();
      } catch (err) {
        console.error(err);
        alert("Lỗi khi đọc file banggia.xlsx: " + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadExcel);
  </script>
</body>
</html>
