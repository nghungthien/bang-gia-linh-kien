<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Bảng giá linh kiện giá sỉ</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- DataTables -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

  <style>
    /* ====== BASE ====== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #2e2e2e;
    }

    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto 40px;
      padding: 0 16px;
    }

    h1.page-title {
      margin: 20px auto 4px !important;
      font-size: 28px;
      font-weight: 800;
      color: #e74c3c;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .page-subtitle {
      text-align: center;
      font-size: 13px;
      color: #7a7a7a;
      margin-bottom: 16px;
    }

    /* ====== CONTROLS ====== */
    .controls {
      max-width: 900px;
      margin: 0 auto 16px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .filter-row label {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    .filter-row select {
      width: 260px;
      height: 38px;
      font-size: 14px;
    }

    .search-row {
      border: 2px solid #e74c3c;
      border-radius: 4px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
      background-color: #fff;
    }

    .search-row label {
      margin-right: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .search-row input {
      border: none;
      outline: none !important;
      flex: 1;
      font-size: 14px;
    }

    .search-icon {
      margin-left: 8px;
      font-size: 20px;
      color: #555;
    }

    /* ====== TABLE CARD ====== */
    .table-card {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
      padding: 8px 10px 12px;
      border: 1px solid #e3e3e3;
    }

    table#banggia {
      margin-bottom: 0 !important;
      font-size: 14px;
    }

    /* ====== HEADER COLUMNS (áp dụng cho cả header clone của DataTables) ====== */
    table.dataTable thead > tr > th {
      text-align: center !important;
      vertical-align: middle !important;
      color: #e74c3c !important;
      font-weight: 800 !important;
      background-color: #ffffff !important;
      font-size: 14px;
    }

    /* ====== COLUMN STYLES ====== */

    /* SẢN PHẨM – xanh Facebook + in đậm */
    td.sanpham {
      color: #1877F2 !important;
      font-weight: 700 !important;
      text-decoration: none;
      text-align: left !important;
    }

    /* Hover màu xanh đậm hơn */
    table#banggia tbody tr:hover td.sanpham {
      color: #0d5fcc !important;
    }

    /* GIÁ BÁN – căn phải */
    td.gia {
      text-align: right !important;
      padding-right: 15px !important;
      white-space: nowrap;
      font-weight: 500;
    }

    /* VAT & BẢO HÀNH – căn giữa */
    td.center {
      text-align: center !important;
      white-space: nowrap;
    }

    /* Zebra + hover */
    table#banggia tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    table#banggia tbody tr:hover {
      background-color: #f0f4ff;
    }

    /* Tổng sản phẩm */
    #totalRow {
      margin-top: 8px;
      font-weight: 700;
      font-size: 14px;
      text-align: left;
      color: #444;
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <h1 class="page-title">BẢNG GIÁ LINH KIỆN GIÁ SỈ</h1>
    <div class="page-subtitle">
      Dữ liệu lấy trực tiếp từ Google Sheet – lọc theo loại & tìm kiếm nhanh.
    </div>

    <!-- Khối controls -->
    <div class="controls">
      <div class="filter-row">
        <label for="categoryFilter">Loại sản phẩm:</label>
        <select id="categoryFilter" class="form-select">
          <option value="">Tất cả</option>
        </select>
      </div>

      <div class="search-row">
        <label for="globalSearch">Search:</label>
        <input type="text" id="globalSearch" placeholder="Nhập tên sản phẩm, bảo hành, VAT...">
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <!-- Bảng + tổng -->
    <div class="table-card">
      <table id="banggia" class="table table-striped table-hover table-bordered">
        <thead>
          <tr>
            <th>SẢN PHẨM</th>
            <th>GIÁ BÁN</th>
            <th>VAT</th>
            <th>BẢO HÀNH</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="totalRow">Tổng số sản phẩm: 0</div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

  <script>
    let table = null;
    let currentCategory = "";

    // Filter theo loại
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
      if (!currentCategory) return true;
      const rowNode = table.row(dataIndex).node();
      const cat = rowNode.getAttribute("data-category") || "";
      return cat === currentCategory;
    });

    function updateTotalRow() {
      const count = table.rows({ filter: "applied" }).count();
      document.getElementById("totalRow").textContent =
        "Tổng số sản phẩm: " + count.toLocaleString("vi-VN");
    }

    function buildCategoryFilter() {
      const select = document.getElementById("categoryFilter");
      while (select.options.length > 1) select.remove(1);

      const categories = new Set();
      table.rows().every(function () {
        const node = this.node();
        const cat = node.getAttribute("data-category");
        if (cat) categories.add(cat);
      });

      Array.from(categories).sort().forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });

      select.addEventListener("change", function () {
        currentCategory = this.value || "";
        table.draw();
      });
    }

    function initDataTable() {
      if ($.fn.DataTable.isDataTable("#banggia")) {
        $("#banggia").DataTable().destroy();
      }

      table = $("#banggia").DataTable({
        dom: "rt",
        paging: false,
        scrollY: "60vh",
        scrollCollapse: true,
        language: { emptyTable: "Không có dữ liệu" }
      });

      document.getElementById("globalSearch")
        .addEventListener("keyup", function () {
          table.search(this.value).draw();
        });

      table.on("draw", updateTotalRow);

      buildCategoryFilter();
      updateTotalRow();
    }

    // ====== LOAD GOOGLE SHEET (gviz JSON) ======
    async function loadGoogleSheet() {
      try {
        const sheetID = "1nY2O5p4DBaJtyRh1Ff0OSs6WL2r-0514GSJXbFXWieI";
        const sheetName = "giacapnhat";   // tên sheet trong file của bạn
        const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;

        const res = await fetch(url);
        const text = await res.text();

        // Google trả về "/*O_o*/\ngoogle.visualization.Query.setResponse({...});"
        const json = JSON.parse(text.substring(47, text.length - 2));

        const tbody = document.querySelector("#banggia tbody");
        tbody.innerHTML = "";

        json.table.rows.forEach(row => {
          const cells = row.c;
          if (!cells) return;

          const category = cells[0]?.v || "";
          const name     = cells[1]?.v || "";
          const price    = cells[2]?.v || "";
          const vat      = cells[3]?.v || "";
          const warranty = cells[4]?.v || "";

          if (!name) return;

          const tr = document.createElement("tr");
          tr.setAttribute("data-category", category);

          tr.innerHTML = `
            <td class="sanpham">${name}</td>
            <td class="gia">${price}</td>
            <td class="center">${vat}</td>
            <td class="center">${warranty}</td>
          `;

          tbody.appendChild(tr);
        });

        initDataTable();
      } catch (err) {
        alert("Lỗi tải Google Sheet: " + err.message);
      }
    }

    document.addEventListener("DOMContentLoaded", loadGoogleSheet);
  </script>

</body>
</html>
